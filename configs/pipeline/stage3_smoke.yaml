pipeline:
  input_path: examples/inputs/stage3_smoke.json
  checkpoint_path: null
  output_path: outputs/stage3_joint_smoke_output.json
  allow_random_weights: true

device:
  type: cpu
  dtype: float32

seed: 42

chemical_vocabulary:
  atom_types:
    - C
    - N
    - O
    - S
    - P
    - F
    - Cl
    - Br
    - I
  bond_types:
    - SINGLE
    - DOUBLE
    - TRIPLE
    - AROMATIC

model:
  type: egnn_denoiser
  atom_feature_dim: 4
  edge_feature_dim: 2
  atom_type_vocab_size: 9
  bond_type_vocab_size: 4
  hidden_dim: 16
  num_layers: 2
  timestep_embedding_dim: 8
  coordinate_scale: 0.1
  epsilon: 1.0e-8
  max_time_period: 10000.0
  descriptor_dim: 3
  num_atom_types: 9
  num_bond_types: 4

field_conditioning:
  mode: additive
  channels:
    - occupancy
    - nearest_distance

field:
  type: gaussian_geometry
  sigma: 1.0
  cutoff: 8.0
  epsilon: 1.0e-8
  channels:
    occupancy: true
    nearest_distance: true

diffusion:
  mode: joint_chemical
  num_timesteps: 4
  beta_schedule: linear
  beta_start: 0.001
  beta_end: 0.02
  prediction_type: epsilon
  loss_reduction: mean
  num_atom_types: 9
  num_bond_types: 4
  coordinate_loss_weight: 1.0
  atom_loss_weight: 1.0
  bond_loss_weight: 1.0

sampling:
  return_trajectory: false
