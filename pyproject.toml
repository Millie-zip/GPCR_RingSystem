[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcr-ringgen"
version = "0.1.0"
description = "Software skeleton for future GPCR ring-system molecular generation research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
preprocessing = ["rdkit>=2023.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
